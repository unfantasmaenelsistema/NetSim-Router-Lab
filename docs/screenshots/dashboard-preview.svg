  <text x="825" y="538" font-family="sans-serif" font-weight="700" font-size="14" fill="#f87171">ESCUDO CIBERNETICO ACTIVO</text>
  <text x="825" y="565" font-family="sans-serif" font-size="12" fill="#fca5a5">Ataques bloqueados en 24h: 34 intentos</text>
  <text x="825" y="585" font-family="sans-serif" font-size="12" fill="#cbd5e1">Última amenaza: Brute Force SSH [203.0.113.44]</text>
  <text x="825" y="605" font-family="sans-serif" font-size="12" fill="#cbd5e1">Auditoría router: 92/100 (Grado A - Seguro)</text>
  <rect x="825" y="618" width="160" height="24" rx="6" fill="#991b1b"/>
  <text x="837" y="634" font-family="sans-serif" font-weight="600" font-size="11" fill="#ffffff">Ver Laboratorio Lab ➔</text>
