  <path d="M48 52 L53 57 L64 45" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="86" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="20" fill="#f8fafc">NetSim Router Lab</text>
  <text x="86" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Simulador Educativo de Redes &amp; Ciberseguridad · v1.0.0</text>

  <!-- Status pill & Theme badge -->
  <rect x="880" y="38" width="130" height="28" rx="14" fill="#065f46" stroke="#10b981" stroke-width="1"/>
  <circle cx="896" cy="52" r="5" fill="#34d399" filter="url(#glow)"/>
  <text x="910" y="56" font-family="sans-serif" font-weight="600" font-size="12" fill="#a7f3d0">ONLINE · WAN OK</text>
  
  <rect x="1025" y="38" width="135" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="1042" y="56" font-family="sans-serif" font-weight="500" font-size="12" fill="#cbd5e1">🌓 Tema: Sistema</text>

  <!-- Navigation Bar (Two rows) -->
  <rect x="20" y="94" width="1160" height="68" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Row 1 tags -->
  <text x="36" y="117" font-family="sans-serif" font-weight="700" font-size="10" fill="#38bdf8">ROUTER &amp; RED:</text>
  <rect x="135" y="103" width="135" height="22" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
  <text x="145" y="118" font-family="sans-serif" font-weight="600" font-size="11" fill="#ffffff">📊 Dashboard &amp; HW</text>
  
  <rect x="280" y="103" width="115" height="22" rx="6" fill="#1e293b"/>
  <text x="290" y="118" font-family="sans-serif" font-size="11" fill="#94a3b8">📶 Wi-Fi &amp; Espectro</text>

  <rect x="405" y="103" width="105" height="22" rx="6" fill="#1e293b"/>
  <text x="415" y="118" font-family="sans-serif" font-size="11" fill="#94a3b8">🌐 Red LAN/DHCP</text>

  <rect x="520" y="103" width="115" height="22" rx="6" fill="#1e293b"/>
  <text x="530" y="118" font-family="sans-serif" font-size="11" fill="#94a3b8">🛡️ Firewall/Seguridad</text>

  <rect x="645" y="103" width="125" height="22" rx="6" fill="#1e293b"/>
