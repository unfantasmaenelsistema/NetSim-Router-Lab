  <text x="40" y="538" font-family="sans-serif" font-weight="700" font-size="14" fill="#f8fafc">TRÁFICO DE RED EN TIEMPO REAL (RX / TX)</text>
  
  <!-- Simulated graph line -->
  <polyline points="40,610 120,595 180,620 250,570 320,580 400,550 480,575 560,540 640,565 720,530 760,545" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <polyline points="40,630 120,625 180,635 250,610 320,620 400,600 480,615 560,590 640,605 720,580 760,590" fill="none" stroke="#10b981" stroke-width="2"/>
  <text x="40" y="640" font-family="sans-serif" font-size="11" fill="#38bdf8">● Descarga (RX): 84.6 Mbps</text>
  <text x="210" y="640" font-family="sans-serif" font-size="11" fill="#10b981">● Subida (TX): 21.3 Mbps</text>

