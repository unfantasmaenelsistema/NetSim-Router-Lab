  <text x="420" y="148" font-family="sans-serif" font-size="11" fill="#cbd5e1">🔍 Sniffer de Paquetes</text>

  <rect x="550" y="133" width="125" height="22" rx="6" fill="#1e293b"/>
  <text x="560" y="148" font-family="sans-serif" font-size="11" fill="#cbd5e1">🔧 Taller de Averías</text>

  <rect x="685" y="133" width="130" height="22" rx="6" fill="#1e293b"/>
  <text x="695" y="148" font-family="sans-serif" font-size="11" fill="#cbd5e1">🏆 Misiones (5/5)</text>

  <rect x="825" y="133" width="110" height="22" rx="6" fill="#1e293b"/>
  <text x="835" y="148" font-family="sans-serif" font-size="11" fill="#cbd5e1">📖 Glosario Redes</text>

  <!-- Physical Router Chassis Mockup Component -->
  <rect x="20" y="174" width="1160" height="155" rx="16" fill="#020617" stroke="#334155" stroke-width="2"/>
  
  <text x="40" y="202" font-family="sans-serif" font-weight="700" font-size="14" fill="#38bdf8">CHASIS FÍSICO DE ROUTER · ARCHER AX5400 PRO (VIRTUAL)</text>
  <text x="40" y="218" font-family="sans-serif" font-size="11" fill="#64748b">Emulación en tiempo real de LEDs de actividad y puertos RJ-45 Gigabit</text>

