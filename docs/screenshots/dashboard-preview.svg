  <text x="38" y="375" font-family="sans-serif" font-weight="700" font-size="14" fill="#38bdf8">CONEXIÓN WAN</text>
  <text x="38" y="405" font-family="monospace" font-size="18" font-weight="bold" fill="#f8fafc">185.120.45.89</text>
  <text x="38" y="425" font-family="sans-serif" font-size="12" fill="#94a3b8">Gateway: 185.120.45.1</text>
  <text x="38" y="445" font-family="sans-serif" font-size="12" fill="#94a3b8">DNS: 1.1.1.1, 8.8.8.8</text>
  <text x="38" y="475" font-family="sans-serif" font-weight="600" font-size="12" fill="#34d399">● Fibra Óptica FTTH 1Gbps</text>

  <!-- Card 2: LAN & Subnet -->
  <rect x="315" y="345" width="275" height="150" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="333" y="375" font-family="sans-serif" font-weight="700" font-size="14" fill="#38bdf8">RED LOCAL (LAN)</text>
  <text x="333" y="405" font-family="monospace" font-size="18" font-weight="bold" fill="#f8fafc">192.168.1.1 /24</text>
  <text x="333" y="425" font-family="sans-serif" font-size="12" fill="#94a3b8">Rango: 192.168.1.100 - .200</text>
  <text x="333" y="445" font-family="sans-serif" font-size="12" fill="#94a3b8">DHCP Leases activos: 8 equipos</text>
  <text x="333" y="475" font-family="sans-serif" font-weight="600" font-size="12" fill="#38bdf8">● Dominio: lan.local</text>

  <!-- Card 3: Wi-Fi Networks -->
  <rect x="610" y="345" width="275" height="150" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="628" y="375" font-family="sans-serif" font-weight="700" font-size="14" fill="#38bdf8">REDES WI-FI DUAL BAND</text>
  <text x="628" y="402" font-family="sans-serif" font-weight="bold" font-size="14" fill="#f8fafc">NetSim-Home (2.4G Ch 6)</text>
  <text x="628" y="420" font-family="sans-serif" font-size="12" fill="#94a3b8">Seguridad: WPA2-Personal</text>
  <text x="628" y="445" font-family="sans-serif" font-weight="bold" font-size="14" fill="#f8fafc">NetSim-5G (5GHz Ch 36)</text>
  <text x="628" y="465" font-family="sans-serif" font-size="12" fill="#34d399">Seguridad: WPA3-SAE (Ultra Seguro)</text>

  <!-- Card 4: Hardware Metrics & Load -->
  <rect x="905" y="345" width="275" height="150" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="923" y="375" font-family="sans-serif" font-weight="700" font-size="14" fill="#38bdf8">RECURSOS DEL SISTEMA</text>
  <text x="923" y="405" font-family="sans-serif" font-size="12" fill="#cbd5e1">CPU Quad-Core: 24%</text>
  <rect x="923" y="413" width="240" height="8" rx="4" fill="#0f172a"/>
  <rect x="923" y="413" width="60" height="8" rx="4" fill="#10b981"/>

  <text x="923" y="445" font-family="sans-serif" font-size="12" fill="#cbd5e1">Memoria RAM: 412 MB / 1024 MB (40%)</text>
  <rect x="923" y="453" width="240" height="8" rx="4" fill="#0f172a"/>
  <rect x="923" y="453" width="96" height="8" rx="4" fill="#06b6d4"/>
  <text x="923" y="480" font-family="monospace" font-size="11" fill="#94a3b8">Uptime: 14d 6h 32m</text>

  <!-- Bottom Interactive Quick Panels -->
