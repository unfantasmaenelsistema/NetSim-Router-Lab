  <rect x="135" y="133" width="145" height="22" rx="6" fill="#1e293b"/>
  <text x="145" y="148" font-family="sans-serif" font-size="11" fill="#cbd5e1">🛡️ Ciberseguridad Lab</text>

  <rect x="290" y="133" width="110" height="22" rx="6" fill="#1e293b"/>
  <text x="300" y="148" font-family="sans-serif" font-size="11" fill="#cbd5e1">💻 Terminal CLI</text>

